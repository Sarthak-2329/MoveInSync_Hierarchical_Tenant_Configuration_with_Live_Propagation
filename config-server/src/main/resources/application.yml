server:
  port: ${PORT:8080}

spring:
  application:
    name: config-server
  datasource:
    url: jdbc:h2:file:./data/configdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

security:
  enabled: ${SECURITY_ENABLED:true}
  api-keys:
    - key: "admin-secret-key"
      role: ADMIN
      tenantId: "*"
    - key: "operator-google-key"
      role: OPERATOR
      tenantId: "google"
    - key: "viewer-google-key"
      role: VIEWER
      tenantId: "google"
    - key: "operator-uber-key"
      role: OPERATOR
      tenantId: "uber"
    - key: "viewer-uber-key"
      role: VIEWER
      tenantId: "uber"
    - key: "operator-clienta-key"
      role: OPERATOR
      tenantId: "clientA"
    - key: "viewer-clienta-key"
      role: VIEWER
      tenantId: "clientA"
    - key: "operator-clientb-key"
      role: OPERATOR
      tenantId: "clientB"
    - key: "viewer-clientb-key"
      role: VIEWER
      tenantId: "clientB"
